server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy → backend.
    # Both backend and frontend use `network_mode: host` on Linux so
    # nginx can reach the backend on loopback. (Bridge networking +
    # host.docker.internal:8000 fails when UFW drops docker→host
    # traffic to published host ports.)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket proxy → backend (same upstream, see /api/ comment).
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
